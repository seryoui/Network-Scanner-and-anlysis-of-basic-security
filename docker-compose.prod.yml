version: '3.8'

services:
  netscan:
    image: ghcr.io/your-org/netscan:latest
    container_name: netscan-prod
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - netscan-network

networks:
  netscan-network:
    driver: bridge
